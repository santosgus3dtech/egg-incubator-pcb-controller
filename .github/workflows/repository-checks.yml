name: repository checks

on:
  push:
  pull_request:

jobs:
  required-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check curated hardware package
        run: |
          test -f README.md
          test -f docs/portfolio-case-study.md
          test -f docs/POWER_BUCK_AP63205_DESIGN_NOTES_REV_3_7.txt
          test -f easyeda/BOM_REV_3_7_AP63205.csv
          test -d docs/screenshots
          test -d releases
